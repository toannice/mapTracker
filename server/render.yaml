services:
  - type: web
    name: blind-map-survival
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      - key: LOG_LEVEL
        value: info
      - key: MAX_ROOMS
        value: "100"
      - key: TURN_SECONDS
        value: "30"
      - key: ALLOWED_ORIGINS
        value: "*"
      # Client update banner. GITHUB_REPO makes the server poll for the newest
      # release, so shipping an APK needs no redeploy here. Requires the repo
      # to be public — the poll is unauthenticated.
      - key: GITHUB_REPO
        value: toannice/mapTracker
      - key: RELEASE_POLL_MINUTES
        value: "10"
      # Raise to the versionCode of the oldest build the current protocol still
      # supports; older clients are then blocked instead of merely nudged.
      - key: MIN_VERSION_CODE
        value: "0"
