# Builds a signed APK whenever a v* tag is pushed and attaches it to the
# matching GitHub Release, so testers install from a stable link instead of
# being sent files by hand.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    base64 of the upload keystore (see README note below)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias, e.g. blindmap-upload
#   KEY_PASSWORD       key password (same as KEYSTORE_PASSWORD if you pressed
#                      Enter when keytool asked)
#
# Produce KEYSTORE_BASE64 locally with:
#   base64 -w0 blindmap-upload.jks    (Linux)
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("blindmap-upload.jks"))
name: Release APK

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # v1.2.3 -> VERSION_NAME=1.2.3, VERSION_CODE=10203. Monotonic as long as
      # minor and patch stay below 100, which is plenty here.
      - name: Derive version from tag
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NAME"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          if [ "$CODE" -le 0 ]; then
            echo "::error::tag '$GITHUB_REF_NAME' did not yield a positive versionCode"
            exit 1
          fi
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Building $NAME (versionCode $CODE)"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — cannot sign the release"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > client/keystore.properties

      - name: Build signed APK
        working-directory: client
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease --no-daemon

      # Leaves nothing behind even if a later step fails.
      - name: Scrub signing material
        if: always()
        run: rm -f client/keystore.properties "$RUNNER_TEMP/upload.jks"

      - name: Rename artifact
        run: |
          mv client/androidApp/build/outputs/apk/release/androidApp-release.apk \
             "blindmap-${VERSION_NAME}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: blindmap-${{ env.VERSION_NAME }}.apk
          generate_release_notes: true
          body: |
            Cài bằng cách tải file `.apk` bên dưới.
            Lần đầu Android sẽ hỏi cho phép cài từ nguồn này — chọn Cho phép.

            versionCode `${{ env.VERSION_CODE }}`
